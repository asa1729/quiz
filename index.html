<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あさあさのゲームクイズ</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            margin-top: 0;
            color: #312e81;
        }

        /* 進行度・スコア表示 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* 変更点1: ゲームタイトルの表示タグ */
        .game-title-tag {
            display: inline-block;
            background-color: #e0e7ff;
            color: #4338ca;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 1px solid #c7d2fe;
        }

        /* 問題文 */
        .question-box {
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            line-height: 1.4;
            color: #1e293b;
        }

        /* 選択肢ボタン */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 14px 20px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background-color: #f8fafc;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e0f2fe;
            border-color: #0284c7;
        }

        /* 正解・不正解のスタイリング */
        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: #16a34a !important;
            color: #14532d !important;
        }

        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: #dc2626 !important;
            color: #7f1d1d !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        /* スタート・リスタート画面ボタン */
        .main-btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background-color: #4f46e5;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        .main-btn:hover {
            background-color: #4338ca;
            transform: scale(1.03);
        }

        /* 非表示クラス */
        .hidden {
            display: none !important;
        }

        /* リザルト画面 */
        .result-score {
            font-size: 2rem;
            font-weight: bold;
            color: #4f46e5;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- 1. スタート画面 -->
        <div id="startScreen">
            <h1>あさあさのゲームクイズ</h1>
            <p>名作ゲームに関するクイズに挑戦！</p>
            <button id="startBtn" class="main-btn">ゲームスタート</button>
        </div>

        <!-- 2. クイズプレイ画面 -->
        <div id="quizScreen" class="hidden">
            <div class="status-bar">
                <span id="questionProgress">第 1 問</span>
                <span id="currentScore">スコア: 0</span>
            </div>

            <!-- 変更点2: ゲームタイトルの表示エリア -->
            <div id="gameTitle" class="game-title-tag">ゲームタイトル</div>

            <div id="questionText" class="question-box">問題文がここに入ります</div>

            <div class="options-grid">
                <button class="option-btn" data-index="0">選択肢 1</button>
                <button class="option-btn" data-index="1">選択肢 2</button>
                <button class="option-btn" data-index="2">選択肢 3</button>
                <button class="option-btn" data-index="3">選択肢 4</button>
            </div>
        </div>

        <!-- 3. 結果画面 -->
        <div id="resultScreen" class="hidden">
            <h1>リザルト</h1>
            <div id="resultScore" class="result-score">5 問中 0 問正解！</div>
            <p id="resultComment">お疲れ様でした！</p>
            <button id="restartBtn" class="main-btn">もう一度プレイ</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 変更点3: ゲームタイトルを追加したクイズデータ
        // ==========================================
        const quizData = [
            {
                gameTitle: "カービィ，東方project",
                question: "次のカービィBGMに混ざった東方projectのBGMはどれ？",
                options: ["この星をかけた魂の戦い", "故郷の星が映る海", "星砕きの戯れ", "双星はいつしかロッシュ限界へ"],
                answer: 1
            },
            {
                gameTitle: "Minecraft(java)",
                question: "最も基礎攻撃力が高い武器は？",
                options: ["鉄の剣", "緑", "木の斧", "黄"],
                answer: 2
            },
            {
                gameTitle: "ポケットモンスター",
                question: "色違いのルカリオは，青い体表が何色になる？",
                options: ["赤", "黒", "緑", "黄"],
                answer: 3
            },
            {
                gameTitle: "妖怪ウォッチ2真打",
                question: "手洗いイベントでアライ魔将の言う手洗いの目安は１日何時間？",
                options: ["5", "10", "24", "30"],
                answer: 1
            },
            {
                gameTitle: "パックマン",
                question: "パックマンの大好物で、食べるとモンスターを撃退できるようになるアイテムは？",
                options: ["パワーエサ", "スーパーキノコ", "チェリー", "スター"],
                answer: 0
            },
            {
                gameTitle: "スプラトゥーン",
                question: "",
                options: ["パワーエサ", "スーパーキノコ", "チェリー", "スター"],
                answer: 0
            }
        ];

        let shuffledQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        // DOM要素
        const startScreen = document.getElementById('startScreen');
        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');

        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        const questionProgress = document.getElementById('questionProgress');
        const currentScore = document.getElementById('currentScore');
        const gameTitleText = document.getElementById('gameTitle'); // 追加
        const questionText = document.getElementById('questionText');
        const optionButtons = document.querySelectorAll('.option-btn');

        const resultScore = document.getElementById('resultScore');
        const resultComment = document.getElementById('resultComment');

        // 開始処理
        function startQuiz() {
            shuffledQuestions = [...quizData].sort(() => Math.random() - 0.5);
            currentQuestionIndex = 0;
            score = 0;

            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            showQuestion();
        }

        // 問題表示
        function showQuestion() {
            resetState();
            const currentQuestion = shuffledQuestions[currentQuestionIndex];

            // UI更新
            questionProgress.textContent = `第 ${currentQuestionIndex + 1} / ${shuffledQuestions.length} 問`;
            currentScore.textContent = `スコア: ${score}`;
            
            // 変更点4: ゲームタイトルと問題文をセット
            gameTitleText.textContent = `🎮 ${currentQuestion.gameTitle}`;
            questionText.textContent = currentQuestion.question;

            optionButtons.forEach((button, index) => {
                button.textContent = `${index + 1}. ${currentQuestion.options[index]}`;
            });
        }

        function resetState() {
            optionButtons.forEach(button => {
                button.classList.remove('correct', 'wrong');
                button.disabled = false;
            });
        }

        function selectOption(e) {
            const selectedButton = e.target;
            const selectedIndex = parseInt(selectedButton.dataset.index);
            const correctIndex = shuffledQuestions[currentQuestionIndex].answer;

            optionButtons.forEach(button => button.disabled = true);

            if (selectedIndex === correctIndex) {
                selectedButton.classList.add('correct');
                score++;
                currentScore.textContent = `スコア: ${score}`;
            } else {
                selectedButton.classList.add('wrong');
                optionButtons[correctIndex].classList.add('correct');
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < shuffledQuestions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 1200);
        }

        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const total = shuffledQuestions.length;
            resultScore.textContent = `${total} 問中 ${score} 問正解！`;

            const ratio = score / total;
            if (ratio === 1) {
                resultComment.textContent = "全問正解！まさにゲームマスターです！🏆";
            } else if (ratio >= 0.6) {
                resultComment.textContent = "素晴らしい！かなりのゲーマーですね！🎮";
            } else {
                resultComment.textContent = "お見事！次回は全問正解を目指そう！💪";
            }
        }

        startBtn.addEventListener('click', startQuiz);
        restartBtn.addEventListener('click', startQuiz);
        optionButtons.forEach(button => {
            button.addEventListener('click', selectOption);
        });
    </script>

</body>
</html>
